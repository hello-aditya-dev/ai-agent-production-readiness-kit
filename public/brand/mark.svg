<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Readiness Kit — release gate mark">
  <!--
    Readiness Kit brand mark: TEST MATRIX + RELEASE GATE.
    A 2x2 evaluation matrix (three ink cells, one failure-red cell) with a
    strong vertical gate bar to the right. The matrix = evaluation; the
    contrasting cell = the hidden failure; the bar = the release gate.
    Original geometry, no shield/security-cliché references.
  -->
  <!-- matrix cells (2x2), 3 ink + 1 failure -->
  <rect x="6"  y="6"  width="15" height="15" rx="1.5" fill="#101114"/>
  <rect x="6"  y="27" width="15" height="15" rx="1.5" fill="#101114"/>
  <rect x="27" y="6"  width="15" height="15" rx="1.5" fill="#101114"/>
  <!-- the hidden failure cell -->
  <rect x="27" y="27" width="15" height="15" rx="1.5" fill="#C53A2E"/>
  <!-- vertical release gate bar -->
  <rect x="46.5" y="3" width="3" height="42" rx="1.5" fill="#3157FF"/>
</svg>
